[package]
name = "arkion-identity-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Senior Backend Engineer"]
description = "Rust Identity-Aware TLS Reverse Proxy"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "limit"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.1"
http-body-util = "0.1"

# HTTP Client for Proxy Forwarding
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# TLS & X.509
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = { version = "1.8", features = ["std", "alloc"] }
x509-parser = "0.16"
rcgen = "0.13"

# Data & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.14"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Concurrency & Helpers
parking_lot = "0.12"
percent-encoding = "2.3"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
